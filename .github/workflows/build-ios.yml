name: Build RJ Love unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select available Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PYCODE'
          import glob, re
          apps = [p for p in glob.glob('/Applications/Xcode*.app') if re.search(r'Xcode_26[._]', p) and 'beta' not in p.lower()]
          if not apps:
              raise SystemExit('No stable Xcode 26 SDK installed')
          print(max(apps, key=lambda p: tuple(int(n) for n in re.findall(r'\d+', p))))
          PYCODE
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Validate backend and project inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Backend/rj_love_server.py
          python3 Scripts/validate_project.py
          python3 -m unittest -v Tests/test_backend.py

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Build unsigned app
        id: build
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived RJ-Love-build.log
          xcodebuild \
            -project RJLove.xcodeproj \
            -scheme RJLove \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-Love-build.log

      - name: Create unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app bundle found." | tee -a RJ-Love-build.log
            exit 1
          fi
          rm -rf Payload RJ-Love-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-Love-unsigned.ipa Payload
          unzip -t RJ-Love-unsigned.ipa
          ls -lh RJ-Love-unsigned.ipa

      - name: Package app and standalone backend
        if: success()
        shell: bash
        run: |
          python3 Scripts/package_release.py

      - name: Upload complete package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-2.0-Komplettpaket
          path: |
            RJ-Love-2.0-Komplettpaket.zip
            Backend/rj_love_server.py
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-unsigned-IPA
          path: RJ-Love-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload complete build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-build-log
          path: RJ-Love-build.log
          if-no-files-found: ignore
          retention-days: 14

  preview:
    name: Verify simulator and capture interface
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build simulator app
        run: |
          brew install xcodegen
          xcodegen generate
          set -o pipefail
          xcodebuild -project RJLove.xcodeproj -scheme RJLove -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath .sim-derived CODE_SIGNING_ALLOWED=NO build 2>&1 | tee Simulator-build.log
      - name: Capture preview
        run: python3 Scripts/capture_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RJ-Love-interface-preview
          path: |
            Preview-*.png
            Simulator-build.log
          if-no-files-found: warn
