name: Build RJ Love unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rj-love-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select available Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PYCODE'
          import glob, re
          apps = [p for p in glob.glob('/Applications/Xcode*.app') if re.search(r'Xcode_26[._]', p) and 'beta' not in p.lower()]
          if not apps:
              raise SystemExit('No stable Xcode 26 SDK installed')
          print(max(apps, key=lambda p: tuple(int(n) for n in re.findall(r'\d+', p))))
          PYCODE
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Validate backend and project inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Backend/rj_love_server.py
          python3 Scripts/validate_project.py
          python3 -m unittest -q Tests/test_cinema42.py Tests/test_dashboard43.py Tests/test_documents431.py Tests/test_server60.py
          swiftc Shared/HomeShortcuts.swift Shared/HomeLayout.swift Tests/PreferencesSmoke.swift -o /tmp/rj-preferences-smoke
          /tmp/rj-preferences-smoke
          swiftc Shared/QuickCaptureRequest.swift Tests/QuickCaptureSmoke.swift -o /tmp/rj-quick-capture-smoke
          /tmp/rj-quick-capture-smoke

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Build unsigned app
        id: build
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived RJ-Love-build.log
          xcodebuild \
            -project RJLove.xcodeproj \
            -scheme RJLove \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-Love-build.log

      - name: Create unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app bundle found." | tee -a RJ-Love-build.log
            exit 1
          fi
          rm -rf Payload RJ-Love-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-Love-unsigned.ipa Payload
          unzip -t RJ-Love-unsigned.ipa
          ls -lh RJ-Love-unsigned.ipa

      - name: Package app and standalone backend
        if: success()
        shell: bash
        run: |
          python3 Scripts/package_release.py

      - name: Upload complete package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-6.0.0-Komplettpaket
          path: |
            RJ-Love-6.0.0-Komplettpaket.zip
            Backend/rj_love_server.py
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-unsigned-IPA
          path: RJ-Love-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload complete build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-build-log
          path: RJ-Love-build.log
          if-no-files-found: ignore
          retention-days: 14

