name: Build RJ Love unsigned IPA

on:
  push:
    branches: [main, "claude/jolly-volta-8cgxxb"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rj-love-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select available Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PYCODE'
          import glob, re
          apps = [p for p in glob.glob('/Applications/Xcode*.app') if re.search(r'Xcode_26[._]', p) and 'beta' not in p.lower()]
          if not apps:
              raise SystemExit('No stable Xcode 26 SDK installed')
          print(max(apps, key=lambda p: tuple(int(n) for n in re.findall(r'\d+', p))))
          PYCODE
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Validate backend and project inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Backend/rj_love_server.py
          python3 Scripts/validate_project.py
          python3 -m unittest -q Tests/test_widget_profiles.py
          python3 -m unittest -q Tests/test_cinema42.py Tests/test_dashboard43.py Tests/test_documents431.py Tests/test_server60.py Tests/test_server70.py Tests/test_server80.py Tests/test_server90.py Tests/test_server100.py
          swiftc Shared/HomeShortcuts.swift Shared/HomeLayout.swift Tests/PreferencesSmoke.swift -o /tmp/rj-preferences-smoke
          /tmp/rj-preferences-smoke
          swiftc Shared/QuickCaptureRequest.swift Tests/QuickCaptureSmoke.swift -o /tmp/rj-quick-capture-smoke
          /tmp/rj-quick-capture-smoke

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml

      - name: Build unsigned app
        id: build
        shell: bash
        run: |
          set -o pipefail
          rm -rf .github-derived RJ-Love-build.log
          xcodebuild \
            -project RJLove.xcodeproj \
            -scheme RJLove \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/.github-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee RJ-Love-build.log

      - name: Create unsigned IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find "$PWD/.github-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo "No .app bundle found." | tee -a RJ-Love-build.log
            exit 1
          fi
          rm -rf Payload RJ-Love-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry RJ-Love-unsigned.ipa Payload
          unzip -t RJ-Love-unsigned.ipa
          ls -lh RJ-Love-unsigned.ipa

      - name: Package app and standalone backend
        if: success()
        shell: bash
        run: |
          python3 Scripts/package_release.py

      - name: Verify complete package before publishing
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s RJ-Love-10.0.0-Komplettpaket.zip
          unzip -t RJ-Love-10.0.0-Komplettpaket.zip
          python3 - <<'PY'
          import json, zipfile
          archive = zipfile.ZipFile('RJ-Love-10.0.0-Komplettpaket.zip')
          names = set(archive.namelist())
          prefix = 'RJ-Love-10.0.0/'
          required = {prefix + 'RJ-Love-unsigned.ipa', prefix + 'Backend/rj_love_server.py', prefix + 'manifest.json'}
          assert required <= names, 'Missing complete-package contents: ' + str(required - names)
          manifest = json.loads(archive.read(prefix + 'manifest.json'))
          assert manifest['version'] == '10.0.0' and manifest['build'] == 1000
          PY

      - name: Upload complete package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-10.0.0-Komplettpaket
          path: |
            RJ-Love-10.0.0-Komplettpaket.zip
            Backend/rj_love_server.py
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-unsigned-IPA
          path: RJ-Love-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload complete build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-build-log
          path: RJ-Love-build.log
          if-no-files-found: ignore
          retention-days: 14

  launch-test:
    name: Launch test in iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select available Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_APP=$(python3 - <<'PYCODE'
          import glob, re
          apps = [p for p in glob.glob('/Applications/Xcode*.app') if re.search(r'Xcode_26[._]', p) and 'beta' not in p.lower()]
          if not apps:
              raise SystemExit('No stable Xcode 26 SDK installed')
          print(max(apps, key=lambda p: tuple(int(n) for n in re.findall(r'\d+', p))))
          PYCODE
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      - name: Build Debug app for the simulator
        shell: bash
        run: |
          set -o pipefail
          brew install xcodegen
          xcodegen generate --spec project.yml
          xcodebuild -project RJLove.xcodeproj -scheme RJLove -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/.sim-derived" CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build 2>&1 | tail -40

      - name: Launch app with real server and check for crashes
        shell: bash
        run: |
          set -uo pipefail
          APP="$(find "$PWD/.sim-derived/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -type d -print -quit)"
          BUNDLE=eu.rjuhas.rjlove
          python3 Scripts/ci_smoke_server.py > smoke-server.log 2>&1 &
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')]; print(sorted(c,key=lambda x:x['name'])[-1]['udid'])")
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          for service in location-always photos notifications; do xcrun simctl privacy "$DEVICE" grant $service $BUNDLE || true; done
          xcrun simctl location "$DEVICE" set 52.5200,13.4050 || true
          mkdir -p launch-shots
          FAILED=0
          alive() { xcrun simctl spawn "$DEVICE" launchctl list | grep -q "UIKitApplication:$BUNDLE"; }
          run_case() {
            local name="$1"; shift
            xcrun simctl terminate "$DEVICE" $BUNDLE >/dev/null 2>&1 || true
            echo "::group::Launch $name"
            xcrun simctl launch "$DEVICE" $BUNDLE "$@"
            sleep 30
            xcrun simctl io "$DEVICE" screenshot "launch-shots/$name.png" || true
            if alive; then echo "OK: $name läuft nach 30 s"; else echo "::error::Absturz beim Start ($name)"; FAILED=1; fi
            echo "::endgroup::"
          }
          run_case plain
          run_case ci-login --ci-login
          # Background + foreground round trip: heartbeat, live mode, geofence.
          xcrun simctl launch "$DEVICE" com.apple.Preferences || true
          xcrun simctl location "$DEVICE" set 52.5300,13.4200 || true
          sleep 25
          if alive; then echo "OK: im Hintergrund weiter aktiv"; else echo "::error::Absturz im Hintergrund"; FAILED=1; fi
          xcrun simctl openurl "$DEVICE" "rjlove://home" || true
          sleep 15
          xcrun simctl io "$DEVICE" screenshot launch-shots/after-background.png || true
          if alive; then echo "OK: zurück im Vordergrund"; else echo "::error::Absturz beim Zurückkehren"; FAILED=1; fi
          run_case preview --preview
          mkdir -p crash-logs
          find ~/Library/Logs/DiagnosticReports -name '*RJ*' -newer smoke-server.log -exec cp {} crash-logs/ \; 2>/dev/null || true
          for f in crash-logs/*; do [ -f "$f" ] || continue; echo "::group::Crash report $f"; head -c 20000 "$f"; echo "::endgroup::"; FAILED=1; done
          xcrun simctl spawn "$DEVICE" log show --last 6m --style compact --predicate 'process == "RJ Love"' 2>/dev/null | grep -iE "fault|fatal|crash|exception|terminat|assert" | tail -80 || true
          echo "::group::Server log"; tail -60 smoke-server.log; echo "::endgroup::"
          exit $FAILED

      - name: Upload launch screenshots and crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Love-launch-test
          path: |
            launch-shots
            crash-logs
            smoke-server.log
          if-no-files-found: ignore
          retention-days: 14
