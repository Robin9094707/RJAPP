name: RJLove

options:
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.1"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  RJLove:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - RJLove.entitlements
          - Resources
      - path: Shared
    resources:
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.rjlove
        PRODUCT_NAME: RJ Love
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/RJLove.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: RJLoveWidgets
        embed: true
        codeSign: false

  RJLoveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
        excludes:
          - Info.plist
          - RJLoveWidgets.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.rjlove.widgets
        PRODUCT_NAME: RJLoveWidgets
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WidgetExtension/RJLoveWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  RJLove:
    build:
      targets:
        RJLove: all
        RJLoveWidgets: all
    run:
      config: Debug
    archive:
      config: Release
